<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Economy Overlay</title>
<style>
/* ── Reset & base ─────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
    background: transparent;
    overflow: hidden;
    font-family: 'Rajdhani', 'Segoe UI', sans-serif;
    color: #fff;
    -webkit-font-smoothing: antialiased;
}

/* ── Chat container ───────────────────────────────────────────────────────── */
#chat-container {
    position: fixed;
    bottom: 24px;
    left: 20px;
    width: 460px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-height: 680px;
    overflow: hidden;
    justify-content: flex-end;
}

/* ── Individual chat message ──────────────────────────────────────────────── */
.chat-msg {
    background: rgba(8, 8, 12, 0.88);
    border-radius: 6px;
    padding: 9px 13px 9px 13px;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    border-left: 4px solid #444;
    backdrop-filter: blur(8px);
    animation: slideIn 0.28s cubic-bezier(0.22, 1, 0.36, 1) both;
    will-change: transform, opacity;
    word-break: break-word;
    position: relative;
}

.chat-msg.eternal-glow {
    box-shadow: 0 0 18px var(--eternal-clr,#fff4), inset 0 0 8px var(--eternal-clr,#fff2);
    border-color: var(--eternal-clr, #fff) !important;
}

.chat-msg.fade-out {
    animation: fadeSlideOut 0.45s ease-out forwards;
}

/* Rank icon */
.rank-icon {
    width: 28px;
    height: 28px;
    object-fit: contain;
    flex-shrink: 0;
    margin-top: 2px;
    filter: drop-shadow(0 1px 3px rgba(0,0,0,.6));
}

/* User-info column */
.user-info {
    display: flex;
    flex-direction: column;
    width: 100%;
    min-width: 0;
}

.user-header {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 4px;
    font-size: 14.5px;
    font-weight: 700;
    line-height: 1.2;
}

/* ═══ THE LEGACY AURA — color and glow both driven by lifetimePeakRankColor ══ */
.username {
    letter-spacing: .4px;
    color: var(--peak-color, #fff);
    text-shadow:
        0 0  8px var(--peak-color, #fff),
        0 0 18px color-mix(in srgb, var(--peak-color, #fff) 55%, transparent),
        0 0 30px color-mix(in srgb, var(--peak-color, #fff) 25%, transparent);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 160px;
}

.points {
    color: #999;
    font-size: 12.5px;
    font-weight: 400;
    white-space: nowrap;
}

.colon { color: #ccc; font-weight: 700; }

.msg-text {
    margin-top: 4px;
    font-size: 14px;
    line-height: 1.45;
    color: #ececec;
}

/* ── Annuncio overlay ─────────────────────────────────────────────────────── */
#annuncio-container {
    position: fixed;
    top: 22%;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    z-index: 900;
    pointer-events: none;
    width: 90%;
    max-width: 860px;
}

.annuncio-box {
    background: linear-gradient(135deg, rgba(220,30,100,.95) 0%, rgba(120,0,220,.95) 100%);
    padding: 30px 46px;
    border-radius: 14px;
    box-shadow:
        0 0 48px rgba(255,0,200,.55),
        inset 0 0 18px rgba(255,255,255,.18);
    text-align: center;
    animation: popIn 0.42s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
    border: 1.5px solid rgba(255,255,255,.32);
    backdrop-filter: blur(14px);
    width: 100%;
}

.annuncio-box.hide {
    animation: popOut 0.4s ease-in forwards;
}

.annuncio-label {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 5px;
    color: rgba(255,255,255,.65);
    margin-bottom: 10px;
}

.annuncio-byline {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 12px;
    color: #ffeb3b;
    text-shadow: 0 0 10px #ffeb3b99;
}

.annuncio-msg {
    font-size: 32px;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 4px 14px rgba(0,0,0,.55);
    line-height: 1.25;
    word-break: break-word;
}

/* ── Toast container ──────────────────────────────────────────────────────── */
#toast-container {
    position: fixed;
    top: 18px;
    right: 18px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
    z-index: 1000;
    pointer-events: none;
}

.toast {
    background: rgba(12, 12, 16, 0.94);
    border-radius: 7px;
    padding: 12px 20px;
    font-size: 17px;
    font-weight: 700;
    color: #fff;
    box-shadow: 0 6px 28px rgba(0,0,0,.55);
    border-left: 5px solid #fff;
    backdrop-filter: blur(8px);
    animation: slideInRight 0.3s cubic-bezier(0.22,1,.36,1) both;
    white-space: nowrap;
}

.toast.hide {
    animation: slideOutRight 0.35s ease-in forwards;
}

/* ── Keyframes ────────────────────────────────────────────────────────────── */
@keyframes slideIn {
    from { opacity: 0; transform: translateX(-28px); }
    to   { opacity: 1; transform: translateX(0); }
}
@keyframes fadeSlideOut {
    to { opacity: 0; transform: translateX(-18px); }
}
@keyframes popIn {
    from { opacity: 0; transform: scale(.52) translateY(40px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
}
@keyframes popOut {
    to { opacity: 0; transform: scale(.82) translateY(-28px); }
}
@keyframes slideInRight {
    from { opacity: 0; transform: translateX(32px); }
    to   { opacity: 1; transform: translateX(0); }
}
@keyframes slideOutRight {
    to { opacity: 0; transform: translateX(32px); }
}
</style>
</head>
<body>

<div id="chat-container"></div>
<div id="annuncio-container"></div>
<div id="toast-container"></div>

<script>
// ═══════════════════════════════════════════════════════════════════════════════
//  CONFIG — adjust WS address if your Streamer.bot runs elsewhere
// ═══════════════════════════════════════════════════════════════════════════════
const WS_URL          = "ws://127.0.0.1:8080/";
const MSG_LIFETIME_MS = 22000;   // how long a chat message stays visible
const MAX_MESSAGES    = 14;      // max chat lines on screen at once
const RECONNECT_MS    = 3500;    // delay before reconnect attempt
const ANNUNCIO_MS     = 9000;    // how long an annuncio stays visible
const TOAST_MS        = 7000;    // default toast duration

// ═══════════════════════════════════════════════════════════════════════════════
//  WebSocket with auto-reconnect
// ═══════════════════════════════════════════════════════════════════════════════
let ws = null;
let wsReady = false;

function connect() {
    console.log("[WS] Connecting to", WS_URL);
    ws = new WebSocket(WS_URL);

    ws.addEventListener("open", () => {
        wsReady = true;
        console.log("[WS] Connected.");

        // Subscribe to the Economy event source (Streamer.bot v1.0.4 protocol)
        const sub = {
            request: "Subscribe",
            id:      "economy-overlay-sub",
            events: {
                General: ["Custom"]
            }
        };
        ws.send(JSON.stringify(sub));
    });

    ws.addEventListener("message", (evt) => {
        let raw;
        try { raw = JSON.parse(evt.data); }
        catch { return; }

        let payload;
        // Checks if data is nested inside Streamer.bot's double-wrapped wrapper
        if (raw.data && typeof raw.data.data === 'string') {
            try { 
                payload = JSON.parse(raw.data.data); 
            } catch { 
                payload = raw.data; 
            }
        } else {
            payload = raw.data ?? raw;
        }

        handlePayload(payload);
    });

    ws.addEventListener("close", () => {
        wsReady = false;
        console.log(`[WS] Disconnected. Retrying in ${RECONNECT_MS}ms…`);
        setTimeout(connect, RECONNECT_MS);
    });

    ws.addEventListener("error", (err) => {
        console.error("[WS] Error:", err);
        ws.close();
    });
}

connect();

// ═══════════════════════════════════════════════════════════════════════════════
//  Payload router
// ═══════════════════════════════════════════════════════════════════════════════
function handlePayload(data) {
    if (!data || !data.event) return;
    switch (data.event) {
        case "chat_message":   renderChat(data);          break;
        case "annuncio":       renderAnnuncio(data);      break;
        case "bet_resolved":   renderBetResolved(data);   break;
        case "season_reset":   renderSeasonReset(data);   break;
        default:
            console.log("[WS] Unknown event:", data.event);
    }
}

// ═══════════════════════════════════════════════════════════════════════════════
//  Chat renderer  — applies Legacy Aura via CSS custom property
// ═══════════════════════════════════════════════════════════════════════════════
function renderChat(data) {
    const container = document.getElementById("chat-container");

    // Sanitise text to prevent XSS (data.message arrives already HTML-encoded from C#,
    // but we decode it safely and re-encode for display)
    const safeMessage  = escapeHtml(decodeHtmlEntities(data.message  ?? ""));
    const safeUsername = escapeHtml(data.username ?? "Unknown");

    const peakColor = data.lifetimePeakRankColor ?? "#ffffff";
    const rankColor = data.rankColor             ?? "#ffffff";
    const isEternal = data.rankId === 9;

    const el = document.createElement("div");
    el.className = "chat-msg" + (isEternal ? " eternal-glow" : "");
    el.style.setProperty("--peak-color", peakColor);
    el.style.borderLeftColor = peakColor;
    if (isEternal) el.style.setProperty("--eternal-clr", rankColor);

    // Rank icon — fall back to a blank transparent 1×1 if file missing
    //const iconSrc = data.rankIcon ?? "/icons/wood.svg";


    // Strip any leading slashes sent by the bot so it looks cleanly in our local folder
    let rawIcon = data.rankIcon ?? "icons/wood.svg";
    const iconSrc = rawIcon.startsWith('/') ? rawIcon.substring(1) : rawIcon;
    
    el.innerHTML =
        `<img src="${iconSrc}" alt="${escapeHtml(data.rankName ?? '')}" class="rank-icon"` +
        ` onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 1 1%22/%3E'">`+
        `<div class="user-info">` +
            `<div class="user-header">` +
                `<span class="username">${safeUsername}</span>` +
                `<span class="points">(${Number(data.points ?? 0).toLocaleString()})</span>` +
                `<span class="colon">:</span>` +
            `</div>` +
            `<div class="msg-text">${safeMessage}</div>` +
        `</div>`;

    container.appendChild(el);

    // Trim overflow
    while (container.children.length > MAX_MESSAGES) {
        container.removeChild(container.firstChild);
    }

    // Auto-remove after lifetime
    const timer = setTimeout(() => {
        el.classList.add("fade-out");
        setTimeout(() => el.parentElement && el.remove(), 450);
    }, MSG_LIFETIME_MS);

    // Allow earlier removal if trimmed
    el._removeTimer = timer;
}

// ═══════════════════════════════════════════════════════════════════════════════
//  Annuncio renderer
// ═══════════════════════════════════════════════════════════════════════════════
function renderAnnuncio(data) {
    const container = document.getElementById("annuncio-container");

    const box = document.createElement("div");
    box.className = "annuncio-box";

    const safeUser = escapeHtml(data.username ?? "Someone");
    const safeMsg  = escapeHtml(decodeHtmlEntities(data.message ?? ""));

    box.innerHTML =
        `<div class="annuncio-label">📢 Annuncio</div>` +
        `<div class="annuncio-byline">by ${safeUser}</div>` +
        `<div class="annuncio-msg">${safeMsg}</div>`;

    container.appendChild(box);

    setTimeout(() => {
        box.classList.add("hide");
        setTimeout(() => box.parentElement && box.remove(), 420);
    }, ANNUNCIO_MS);
}

// ═══════════════════════════════════════════════════════════════════════════════
//  Bet resolved renderer
// ═══════════════════════════════════════════════════════════════════════════════
function renderBetResolved(data) {
    showToast(`🎲 Bet Resolved! [${escapeHtml(data.winLabel ?? "")}] wins!`, "#4caf50", TOAST_MS);

    const changes = Array.isArray(data.rankChanges) ? data.rankChanges : [];
    changes.forEach((change, i) => {
        if (change.promoted) {
            setTimeout(() => {
                showToast(
                    `⬆️ RANK UP: ${escapeHtml(change.username)} → ${escapeHtml(change.newRankName)}!`,
                    "#AA44FF",
                    6000
                );
            }, 1200 + i * 850);
        } else if (change.demoted) {
            setTimeout(() => {
                showToast(
                    `⬇️ ${escapeHtml(change.username)} dropped to ${escapeHtml(change.newRankName)}`,
                    "#ff5722",
                    5000
                );
            }, 1200 + i * 850);
        }
    });
}

// ═══════════════════════════════════════════════════════════════════════════════
//  Season reset renderer
// ═══════════════════════════════════════════════════════════════════════════════
function renderSeasonReset(data) {
    showToast(`🔄 ${escapeHtml(data.newSeason ?? "New Season")} has begun! GL HF! 🎮`, "#ffeb3b", 9000);
}

// ═══════════════════════════════════════════════════════════════════════════════
//  Toast helper
// ═══════════════════════════════════════════════════════════════════════════════
function showToast(html, accentColor, duration) {
    const container = document.getElementById("toast-container");
    const t = document.createElement("div");
    t.className = "toast";
    t.style.borderLeftColor = accentColor ?? "#fff";
    t.innerHTML = html;            // already escaped by callers
    container.appendChild(t);

    setTimeout(() => {
        t.classList.add("hide");
        setTimeout(() => t.parentElement && t.remove(), 370);
    }, duration ?? TOAST_MS);
}

// ═══════════════════════════════════════════════════════════════════════════════
//  Utility: HTML escape & decode
// ═══════════════════════════════════════════════════════════════════════════════
function escapeHtml(str) {
    return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
}

function decodeHtmlEntities(str) {
    const txt = document.createElement("textarea");
    txt.innerHTML = str;
    return txt.value;
}
</script>
</body>
</html>
